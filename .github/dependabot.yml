# Without this file Dependabot opens one PR per package. Across BWE-Studio that
# was 385 open PRs over 90 repos, dominated by the same five transitives.
#
# First attempt at this grouped only minor+patch, which left every major update
# outside a group and therefore on its own PR -- that pushed the org to 830 open
# PRs. Every update-type is grouped now, so a repo produces at most a handful of
# PRs regardless of how far behind it is.
# 2026-10-04: majors are still grouped, but in their OWN groups. One combined
# group meant a routine minor/patch bump could not merge because it rode with
# major migrations in the same PR. Now: minor+patch groups merge on a green
# gate; each "-majors" group is one PR that is a migration task, not a routine
# bump. Still at most a handful of npm PRs.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
